name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: validate and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate tagged release
        run: npm run validate
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version"
      - name: Pack, checksum and generate SBOM
        id: package
        shell: bash
        run: |
          npm pack --json > pack-metadata.json
          package_file=$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('pack-metadata.json','utf8')); process.stdout.write(value[0].filename)")
          printf 'file=%s\n' "$package_file" >> "$GITHUB_OUTPUT"
          sha256sum "$package_file" > "$package_file.sha256"
          node scripts/generate-sbom.mjs > sbom.cdx.json
      - name: Attest package provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - name: Create GitHub release with immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            "${{ steps.package.outputs.file }}" \
            "${{ steps.package.outputs.file }}.sha256" \
            sbom.cdx.json \
            pack-metadata.json
