id: AO-001
objective: Implement one bounded change with no unrelated edits.
allowedFiles:
  - src/example.ts
inputs:
  - The accepted design or issue description
constraints:
  - Do not change public behavior outside the objective
  - Do not add dependencies
validationCommands:
  - npm test
successCriteria:
  - The requested behavior is covered by a test
  - All deterministic validation passes
budget:
  maxTurns: 3
  maxFilesChanged: 2
resultFormat:
  fields: [status, filesChanged, validation, risks]
