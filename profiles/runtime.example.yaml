# Runtime V4 MCP setup:
# - `runtime activate` generates `.codex/config.toml`; do not add an ad-hoc
#   `mcp` key here.
# - The generated `agent_orchestration_v4` server runs
#   `runtime mcp-stdio --activation <activation-v4.json>` with all seven
#   broker tools enabled and `required = true`.
# - Keep this profile provider-neutral. Concrete providers, models and
#   authentication belong in a dated profile revision.
# See ../docs/architecture-mcp-sdd.md for Desktop and Streamable HTTP setup.
schemaVersion: 4
id: provider-neutral-runtime-example
bindings:
  orchestrator: &frontier_read
    harness: codex
    provider: frontier-provider
    model: frontier-model
    tier: frontier
    capability: frontier_reasoning
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC, PRIVATE]
    permissions: read-only
    guidance: &frontier_guidance
      id: frontier-guidance
      revision: vendor-reviewed-1
      sourceUrls: [https://provider.example.invalid/model-guidance]
      promptFormat: markdown
      contextPlacement: before-task
      reasoningEffort: high
      textVerbosity: low
      temperature: null
      maxSteps: 48
      instructions:
        - Prefer direct, outcome-focused instructions and verify against explicit acceptance criteria.
  executor: &economy_write
    harness: opencode
    provider: economy-provider
    model: economy-model
    tier: economy
    capability: agentic_tool_execution
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC]
    permissions: contract-write
    execution: &economy_execution
      supportedTaskTraits: [mechanical, localized]
      maxSteps: 24
      maxToolUses: 48
      maxNoMutationSteps: 5
      timeoutSeconds: 300
      supportsFailedCandidateRepair: false
    guidance: &economy_guidance
      id: economy-guidance
      revision: vendor-reviewed-1
      sourceUrls: [https://provider.example.invalid/model-guidance]
      promptFormat: markdown
      contextPlacement: before-task
      reasoningEffort: low
      textVerbosity: low
      temperature: 0
      maxSteps: 24
      instructions:
        - Keep the implementation minimal and stop after the requested change and validation are complete.
  escalationExecutor: *economy_write
  frontierExecutor:
    harness: opencode
    provider: frontier-provider
    model: frontier-model
    tier: frontier
    capability: agentic_tool_execution
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC, PRIVATE]
    permissions: contract-write
    execution:
      supportedTaskTraits:
        [
          mechanical,
          localized,
          semantic-debugging,
          cross-file-reasoning,
          multimodal,
          long-horizon,
          architecture,
          security-sensitive,
          migration,
        ]
      maxSteps: 64
      maxToolUses: 128
      maxNoMutationSteps: 12
      timeoutSeconds: 900
      supportsFailedCandidateRepair: false
    guidance: *frontier_guidance
  reviewer: *frontier_read
runtime:
  maxEconomyParallelRequests: 1
  maxConcurrentRunsPerRepository: 1
