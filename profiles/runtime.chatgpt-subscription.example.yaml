# Runtime V4 MCP setup:
# - `runtime activate` generates the managed `.codex/config.toml` binding;
#   MCP transport is not configured by adding a profile field.
# - Desktop uses the required local STDIO server and the seven broker tools:
#   run/repair/finalize/abort/status plus the two broker review controls.
# - `chatgpt-subscription` is intentionally restricted by the schema to
#   read-only Codex orchestrator/reviewer bindings and OS-keyring auth.
# - The Economy executor remains a separate contract-write binding; its
#   provider credential stays behind the trusted gateway.
# See ../docs/architecture-mcp-sdd.md for activation and HTTP details.
schemaVersion: 4
id: chatgpt-subscription-runtime-example
bindings:
  orchestrator: &frontier_read
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    tier: frontier
    authentication: chatgpt-subscription
    capability: frontier_reasoning
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC, PRIVATE]
    permissions: read-only
    guidance: &sol_guidance
      id: openai-gpt-5p6-sol
      revision: official-2026-08-10
      sourceUrls: [https://developers.openai.com/api/docs/guides/latest-model]
      promptFormat: markdown
      contextPlacement: before-task
      reasoningEffort: high
      textVerbosity: low
      temperature: null
      maxSteps: 64
      instructions:
        - Keep prompts lean, state each instruction once, and expose only tools relevant to the task.
        - Preserve hard constraints, autonomy boundaries, required evidence, and success criteria.
  executor: &economy_write
    harness: opencode
    provider: openai
    model: gpt-5.6-luna
    tier: economy
    authentication: provider-api-key
    capability: agentic_tool_execution
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC]
    permissions: contract-write
    execution: &economy_execution
      supportedTaskTraits: [mechanical, localized]
      maxSteps: 32
      maxToolUses: 64
      maxNoMutationSteps: 6
      timeoutSeconds: 420
      supportsFailedCandidateRepair: false
    guidance: &luna_guidance
      id: openai-gpt-5p6-luna
      revision: official-2026-08-10
      sourceUrls: [https://developers.openai.com/api/docs/guides/latest-model, https://opencode.ai/docs/agents]
      promptFormat: markdown
      contextPlacement: before-task
      reasoningEffort: low
      textVerbosity: low
      temperature: null
      maxSteps: 32
      instructions:
        - Keep prompts lean and implement only the requested scope.
        - Prefer direct tool calls and stop when deterministic validation and the output contract are satisfied.
  escalationExecutor: *economy_write
  frontierExecutor:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    tier: frontier
    authentication: provider-api-key
    capability: agentic_tool_execution
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC, PRIVATE]
    permissions: contract-write
    execution:
      supportedTaskTraits:
        [
          mechanical,
          localized,
          semantic-debugging,
          cross-file-reasoning,
          multimodal,
          long-horizon,
          architecture,
          security-sensitive,
          migration,
        ]
      maxSteps: 64
      maxToolUses: 128
      maxNoMutationSteps: 12
      timeoutSeconds: 900
      supportsFailedCandidateRepair: false
    guidance: *sol_guidance
  reviewer: *frontier_read
runtime:
  maxEconomyParallelRequests: 1
  maxConcurrentRunsPerRepository: 1
