# Runtime V4 MCP setup:
# - `runtime activate` generates the managed `.codex/config.toml` binding;
#   MCP transport is not configured by adding a profile field.
# - The ChatGPT subscription binding is read-only Codex orchestration/review;
#   Nano/OpenCode executor credentials remain outside the repository.
# - The generated local STDIO server is required and exposes the seven broker
#   tools, including hash-bound review packet and verdict controls.
# See ../docs/architecture-mcp-sdd.md for activation and HTTP details.
schemaVersion: 4
id: nan-opencode-chatgpt-subscription-2026-08
bindings:
  orchestrator:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    authentication: chatgpt-subscription
    capability: planning
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC, PRIVATE]
    permissions: read-only
    guidance: &sol_guidance
      id: openai-sol-current
      revision: official-2026-08-16
      sourceUrls: [https://developers.openai.com/api/docs/guides/latest-model]
      promptFormat: markdown
      contextPlacement: before-task
      reasoningEffort: high
      textVerbosity: low
      temperature: null
      maxSteps: 64
      instructions:
        - Keep prompts lean and preserve explicit constraints, required evidence, and success criteria.
  executor:
    harness: opencode
    provider: nan
    model: qwen3.6
    authentication: provider-api-key
    capability: coding
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC]
    permissions: contract-write
    execution:
      supportedTaskTraits: [mechanical, localized]
      maxSteps: 24
      maxToolUses: 48
      maxNoMutationSteps: 5
      timeoutSeconds: 240
      supportsFailedCandidateRepair: false
    guidance:
      id: qwen3p6-nan
      revision: nan-api-2026-08-16
      sourceUrls: [https://nan.builders/docs/api, https://nan.builders/docs/models]
      promptFormat: markdown
      contextPlacement: before-task
      reasoningEffort: provider-default
      textVerbosity: low
      temperature: null
      maxSteps: 32
      instructions:
        - Use direct tool calls, keep edits minimal, and stop after the contract and validation are satisfied.
  reasoningExecutor:
    harness: opencode
    provider: nan
    model: deepseek-v4-flash
    authentication: provider-api-key
    capability: semantic-coding
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC]
    permissions: contract-write
    execution: &deepseek_execution
      supportedTaskTraits: [mechanical, localized, semantic-debugging, cross-file-reasoning]
      maxSteps: 40
      maxToolUses: 80
      maxNoMutationSteps: 8
      timeoutSeconds: 420
      supportsFailedCandidateRepair: false
    guidance: &deepseek_guidance
      id: deepseek-v4-flash-nan
      revision: nan-api-2026-08-16
      sourceUrls: [https://nan.builders/docs/api, https://nan.builders/docs/models]
      promptFormat: markdown
      contextPlacement: before-task
      reasoningEffort: provider-default
      textVerbosity: low
      temperature: null
      maxSteps: 48
      instructions:
        - Inspect the relevant code and validation evidence before editing; keep the change inside the frozen contract.
  escalationExecutor:
    harness: opencode
    provider: nan
    model: deepseek-v4-flash
    authentication: provider-api-key
    capability: coding
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC]
    permissions: contract-write
    execution: *deepseek_execution
    guidance: *deepseek_guidance
  frontierExecutor:
    harness: opencode
    provider: nan
    model: deepseek-v4-flash
    authentication: provider-api-key
    capability: coding
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC]
    permissions: contract-write
    execution:
      supportedTaskTraits: [mechanical, localized, semantic-debugging, cross-file-reasoning, long-horizon, architecture, security-sensitive, migration]
      maxSteps: 64
      maxToolUses: 128
      maxNoMutationSteps: 12
      timeoutSeconds: 600
      supportsFailedCandidateRepair: false
    guidance: *deepseek_guidance
  reviewer:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    authentication: chatgpt-subscription
    capability: review
    allowedDataScopes: [SOURCE_CODE_ONLY]
    allowedSourceSensitivity: [PUBLIC, PRIVATE]
    permissions: read-only
    guidance: *sol_guidance
runtime:
  maxEconomyParallelRequests: 1
  maxConcurrentRunsPerRepository: 1
